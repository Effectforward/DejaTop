name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    name: build + tests (${{ matrix.cxx }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cxx: [g++, clang++]
    steps:
      - uses: actions/checkout@v4

      - name: Install test oracles
        run: |
          sudo apt-get update
          sudo apt-get install -y desktop-file-utils libglib2.0-bin python3-gi

      - name: Build and test
        run: make CXX=${{ matrix.cxx }} check

  sanitizers:
    name: ASan + UBSan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install test oracles
        run: |
          sudo apt-get update
          sudo apt-get install -y desktop-file-utils libglib2.0-bin python3-gi

      - name: Build and test with sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: |
          make clean
          make CXXFLAGS="-std=c++17 -O1 -g -Wall -Wextra -fsanitize=address,undefined -fno-omit-frame-pointer" test
